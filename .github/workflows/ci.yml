name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} — tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The repo ships a package-lock.json, so npm ci gives a reproducible
      # install. There is no build step — the server runs plain ESM Node.
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
